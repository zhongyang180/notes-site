<h1 id="rl-%E7%AE%97%E6%B3%95%E7%A0%94%E7%A9%B6%E8%BF%9B%E5%B1%95">RL 算法研究进展</h1>
<p>2025–2026 调研</p>
<br />
<p>调研日期 2026-08-10<br />
配套：《verl技术特性调研报告》（实操侧）</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="2" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="%E4%B8%80%E5%8F%A5%E8%AF%9D%E6%80%BB%E7%BB%93">一句话总结</h2>
<p><strong>这两年 RL for LLM 的算法创新，主心骨不是&quot;发明新目标函数&quot;，</strong></p>
<p><strong>而是围绕 GRPO 这个极简骨架，逐条修掉它的偏置、方差和数值不一致问题。</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="3" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="%E4%B8%83%E6%9D%A1%E4%B8%BB%E7%BA%BF">七条主线</h2>
<ol>
<li>critic-free 成为默认（GRPO 家族全面占领）</li>
<li>但 value function 并没有死（VAPO 反例）</li>
<li>重要性采样的粒度和裁剪方式成了最活跃战场</li>
<li>训练-推理数值不一致从&quot;工程 bug&quot;升格为&quot;算法问题&quot;</li>
<li>熵坍塌被给出了可操作的定量刻画</li>
<li>奖励设计从 rule-based 走向 rubric + 生成式 RM</li>
<li>RL 算力占比在暴涨（DeepSeek-V3.2：超预训练成本 10%）</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="4" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="%E6%BC%94%E5%8C%96%E8%B0%B1%E7%B3%BB">演化谱系</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>                    PPO (2017)  ── actor + critic + GAE + clip
                       │
        ┌──────────────┼──────────────────────┐
        │              │                      │
   去掉 critic      保留 critic            完全离线
        │              │                      │
      GRPO          VC-PPO                DPO / IPO / KTO
   (group baseline)  VAPO                (隐式奖励，无采样)
        │
   ┌────┴─────┬──────────┬───────────┬──────────┐
 Dr.GRPO    DAPO       GSPO        CISPO       SAPO
 (去偏置)  (四件套)  (序列级IS)  (软化IS权重) (温度门控)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="5" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="%E4%B8%89%E6%9D%A1%E8%B7%AF%E5%BE%84%E7%9A%84%E5%8F%96%E8%88%8D">三条路径的取舍</h2>
<table>
<thead>
<tr>
<th>路径</th>
<th>优点</th>
<th>代价</th>
<th>现状</th>
</tr>
</thead>
<tbody>
<tr>
<td>PPO + critic</td>
<td>细粒度 credit assignment</td>
<td>多一个模型的显存；value 在长 CoT 上偏置严重</td>
<td>小众但未死</td>
</tr>
<tr>
<td>critic-free</td>
<td>省一个模型；实现简单</td>
<td>优势估计粗；方差大</td>
<td><strong>主流</strong></td>
</tr>
<tr>
<td>纯离线 DPO</td>
<td>最省；无需采样</td>
<td>不能远离 SFT 策略；无法自我探索</td>
<td>退化为对齐后处理</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="6" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h1 id="grpo-%E7%9A%84%E4%B8%89%E5%AE%97%E7%BD%AA">GRPO 的三宗罪</h1>
<p>最核心的一节</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="7" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="grpo-%E7%9A%84%E9%AA%A8%E6%9E%B6">GRPO 的骨架</h2>
<p>同一 prompt 采 G 个回答，用组内均值和标准差归一化：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>A_i = (R_i - mean(R)) / std(R)
</code></pre>
<p>三个被后续工作反复攻击的点：</p>
<ol>
<li><code>/std(R)</code> 引入<strong>难度偏置</strong></li>
<li>按序列长度归一化引入<strong>长度偏置</strong></li>
<li>token-level IS ratio <strong>方差爆炸</strong>（MoE 的噩梦）</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="8" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="%E7%AC%AC%E4%B8%80%E5%AE%97%E7%BD%AA%E6%9C%89%E9%97%AD%E5%BC%8F%E8%A7%A3">第一宗罪有闭式解</h2>
<p>二元奖励下，组内标准差完全由通过率 p 决定：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>σ = sqrt(p·(1-p))        梯度权重 ∝ 1/σ = 1/sqrt(p·(1-p))
</code></pre>
<table>
<thead>
<tr>
<th>组内答对数 k (G=16)</th>
<th>通过率 p</th>
<th>梯度权重 1/σ</th>
<th>相对 p=0.5</th>
</tr>
</thead>
<tbody>
<tr>
<td>0</td>
<td>0.000</td>
<td><strong>∞（除零）</strong></td>
<td>—</td>
</tr>
<tr>
<td>1</td>
<td>0.0625</td>
<td>4.13</td>
<td><strong>2.07×</strong></td>
</tr>
<tr>
<td>8</td>
<td>0.500</td>
<td>2.00</td>
<td>1.00×（最小）</td>
</tr>
<tr>
<td>15</td>
<td>0.9375</td>
<td>4.13</td>
<td><strong>2.07×</strong></td>
</tr>
<tr>
<td>16</td>
<td>1.000</td>
<td><strong>∞（除零）</strong></td>
<td>—</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="9" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="%E8%BF%99%E5%BC%A0%E8%A1%A8%E8%AF%B4%E6%98%8E%E4%B8%89%E4%BB%B6%E4%BA%8B">这张表说明三件事</h2>
<ol>
<li>
<p><strong>U 型曲线</strong> — 权重在 p=0.5 处最小，向两端上升。<br />
简单题和难题被放大，<strong>中等难度题被压制</strong> —— 而中等难度题信息量最大。</p>
</li>
<li>
<p><strong>两端是真正的奇点</strong> — p=0 或 1 时 σ=0，advantage 变成 0/0。<br />
DAPO 的 Dynamic Sampling 本质就是丢掉这两列，它不是在修正偏置，是在<strong>回避除零</strong>。</p>
</li>
<li>
<p><strong>组越大偏置越严重</strong> — G=16 最极端约 2×，<strong>G=64 可以到约 4×</strong>。<br />
相当反直觉：直觉上会以为加大 G 是在降方差。</p>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="10" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="%E9%9A%BE%E5%BA%A6%E5%81%8F%E7%BD%AE%E7%9A%84%E5%BD%A2%E7%8A%B6">难度偏置的形状</h2>
<p><img src="./grpo_difficulty_bias.png" alt="" style="width:900px;" /></p>
<p>左：U 型曲线　中：不同 G 值的放大倍数　右：热力图</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="11" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="%E4%B8%89%E7%A7%8D%E5%81%9A%E6%B3%95%E5%90%8C%E4%B8%80%E4%B8%AA-%CF%83">三种做法，同一个 σ</h2>
<p><img src="./grpo_three_methods.png" alt="" style="width:820px;" /></p>
<table>
<thead>
<tr>
<th>方法</th>
<th>对 σ 做什么</th>
<th>后果</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>GRPO</strong></td>
<td>除以它</td>
<td>引入 U 型难度偏置</td>
</tr>
<tr>
<td><strong>Dr.GRPO</strong></td>
<td>不除</td>
<td>去掉偏置</td>
</tr>
<tr>
<td><strong>DAPO</strong></td>
<td>丢掉 σ=0 的组</td>
<td>回避奇点</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="12" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="drgrpo--%E5%8E%BB%E6%8E%89%E4%B8%A4%E4%B8%AA%E5%81%8F%E7%BD%AE%E9%A1%B9">Dr.GRPO — 去掉两个偏置项</h2>
<p>COLM 2025, sail-sg</p>
<p><strong>问题：</strong> GRPO 有一个优化偏置，会人为拉长回答长度，尤其是<strong>错误回答</strong>。<br />
社区常说的&quot;RL 训着训着模型变啰嗦&quot;，算法根源就在这 —— 不是模型学会了深度思考。</p>
<p><strong>修法：</strong> 去掉 <code>/std(R)</code>，去掉 per-trajectory 长度归一化</p>
<p><strong>争议：</strong> 2026 有工作论证「无偏」与「长度不变」在 outcome reward 下<strong>不可能同时满足</strong>。<br />
不是&quot;直接抄就赢&quot;的改动，需要自己跑 ablation。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="13" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="dapo--%E5%9B%9B%E4%BB%B6%E5%A5%97%E5%B7%A5%E7%A8%8B%E4%B8%8A%E6%9C%80%E5%AE%9E%E7%94%A8">DAPO — 四件套，工程上最实用</h2>
<p>ByteDance Seed × 清华 AIR，Qwen2.5-32B base 上 AIME 2024 拿到 50 分</p>
<table>
<thead>
<tr>
<th>技巧</th>
<th>解决什么</th>
<th>做法</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Clip-Higher</strong></td>
<td>熵坍塌</td>
<td>解耦上下界，<code>ε_low=0.2, ε_high=0.28</code></td>
</tr>
<tr>
<td><strong>Dynamic Sampling</strong></td>
<td>全对/全错组梯度为零</td>
<td>过滤 std=0 的组，继续采样填满 batch</td>
</tr>
<tr>
<td><strong>Token-level Loss</strong></td>
<td>长回答里 token 被稀释</td>
<td>在 mini-batch 全部 token 上聚合</td>
</tr>
<tr>
<td><strong>Overlong Shaping</strong></td>
<td>截断样本给错误负信号</td>
<td>硬截断下设 4096 缓冲区，线性惩罚</td>
</tr>
</tbody>
</table>
<p>每一个都可以<strong>独立拆下来用</strong>。Clip-Higher 是性价比最高的单点改动 —— 一行配置。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="14" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="gspo--%E6%8A%8A-is-%E6%8F%90%E5%88%B0%E5%BA%8F%E5%88%97%E7%BA%A7">GSPO — 把 IS 提到序列级</h2>
<p>Qwen 团队。Qwen3 系列就是用这套训的。</p>
<p><strong>核心洞察：奖励是序列级的，IS 权重却是 token 级的 —— 粒度不匹配本身就是方差来源。</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>ρ_seq = (π_θ(y|x) / π_old(y|x))^(1/|y|)
</code></pre>
<p><strong>最重要的实证结论：GSPO 显著稳定了 MoE 的 RL 训练。</strong><br />
MoE 的 routing 是离散 top-k，训练/推理间微小数值差异会翻转路由，<br />
逐层累积后大部分 token 被路由到不同专家，token-level IS 假设直接崩掉。</p>
<p><strong>代价：</strong> 一条序列里只要有几个强 off-policy token，GSPO 会压制<strong>整条序列</strong>的梯度。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="15" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="cispo--%E8%A3%81%E6%9D%83%E9%87%8D%E4%B8%8D%E8%A3%81%E6%9B%B4%E6%96%B0">CISPO — 裁权重，不裁更新</h2>
<p>MiniMax-M1</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># GRPO：ratio 出界 → 该 token 梯度归零（信息彻底丢失）</span>
<span class="hljs-comment"># CISPO：clip(ratio).detach() 作为系数 → 梯度保留方向，只压幅度</span>
L = - E[ sg(clip(ρ_t, <span class="hljs-number">1</span>-ε, <span class="hljs-number">1</span>+ε)) · A · log π_θ(a_t) ]
</code></pre>
<p><strong>为什么重要：</strong> 长 CoT 里 ratio 出界的 token，往往恰恰是<strong>关键转折词</strong><br />
—— &quot;wait&quot;、&quot;but&quot;、&quot;actually&quot; 这类引发反思的低概率词。</p>
<p>硬裁剪把它们的梯度扔掉，等于<strong>系统性地压制了反思行为的学习</strong>。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="16" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="sapo--%E8%BD%AF%E8%87%AA%E9%80%82%E5%BA%94%E9%97%A8%E6%8E%A7">SAPO — 软自适应门控</h2>
<p>Qwen 团队，2025-11。Qwen3-VL 用的就是这个。</p>
<p><strong>问题定位：</strong> 硬裁剪造成&quot;稳定性 vs 有效学习&quot;二选一；GSPO 的序列级压制粒度太粗。</p>
<p><strong>做法：</strong> 用平滑的、温度控制的门控替代硬裁剪。<br />
自称同时具备 sequence-coherent 和 token-adaptive。</p>
<p><strong>与 GSPO 的直接对比：</strong> 一条序列里有几个强 off-policy token 时 ——<br />
GSPO 压制整条序列，SAPO 只降权那几个 token，保留近 on-policy 部分的学习信号。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="17" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="%E4%B8%80%E4%B8%AA%E8%A7%82%E5%AF%9F">一个观察</h2>
<p><code>*PO</code> 这个方向已经相当内卷，命名空间几近枯竭。</p>
<p>DCPO / SPO / DGPO / DISPO / OPO / GPG …</p>
<p><strong>边际收益在收窄。我不建议我们投入精力再造一个 PO。</strong></p>
<p>真正的增量在后面几节。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="18" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h1 id="%E8%AE%AD%E7%BB%83-%E6%8E%A8%E7%90%86%E4%B8%8D%E4%B8%80%E8%87%B4">训练-推理不一致</h1>
<p>我认为整份报告里对工程落地最重要的部分</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="19" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="%E9%97%AE%E9%A2%98%E6%9C%AC%E8%B4%A8%E4%B8%89%E4%B8%AA%E7%AD%96%E7%95%A5%E5%BE%88%E5%A4%9A%E5%AE%9E%E7%8E%B0%E5%8F%AA%E8%AE%A4%E4%B8%A4%E4%B8%AA">问题本质：三个策略，很多实现只认两个</h2>
<ul>
<li><code>π_rollout</code> —— 推理引擎（vLLM/SGLang）实际采样用的策略</li>
<li><code>π_old</code> —— 训练引擎重新前向算出的&quot;旧策略&quot;</li>
<li><code>π_θ</code> —— 当前正在更新的策略</li>
</ul>
<p><strong>常见错误：把 <code>π_old</code> 当作行为策略，完全忽略 <code>π_rollout</code> 的存在。</strong></p>
<p>来源：精度差异（FP8/BF16）、后端差异、<strong>MoE routing 翻转</strong>（最严重）、<br />
top-p/top-k 截断造成的动作空间不一致、异步训练的 stale checkpoint</p>
<blockquote>
<p>verl 文档：&quot;This is not PPO's fault - PPO itself is mathematically correct.&quot;<br />
错的是那个假设，而它会直接导致训练崩溃。</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="20" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="%E5%9B%9B%E5%B1%82%E4%BF%AE%E6%B3%95">四层修法</h2>
<p><strong>第一层 修因（最彻底）</strong><br />
Router Replay（MoE 必备）—— 记录 rollout 时每个 token 实际选的专家，训练时强制复用同一路由。<br />
DeepSeek 称 &quot;keep routing&quot;，从 V3-0324 起就在用，明确说是 MoE RL 稳定性的关键。<br />
Keep Sampling Mask —— 把 top-p/top-k 截断 mask 持久化，训练时同样施加。</p>
<p><strong>第二层 修权重（TIS / MIS）</strong><br />
<code>w = exp(clamp(log_ratio, -20, 20)).clamp(max=threshold)</code><br />
关键设计：<strong>只截上界不截下界</strong> —— 保留小权重情形下的无偏性。</p>
<p><strong>第三层 修目标函数</strong> — 就是 CISPO 和 GSPO 在做的事</p>
<p><strong>第四层 数据侧兜底</strong> — 丢掉偏差超阈值的序列。<br />
DeepSeek 的精妙细节：<strong>只对负优势序列施加掩码</strong>。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="21" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="%E4%B8%80%E4%B8%AA%E5%BF%85%E9%A1%BB%E8%AE%B0%E4%BD%8F%E7%9A%84%E5%AE%9E%E8%AF%81%E7%BB%93%E8%AE%BA">一个必须记住的实证结论</h2>
<p>verl 的 FP8 实验，这是整份报告最有操作价值的单条数据：</p>
<blockquote>
<p>Qwen3-8B-Base 上做 FP8 rollout，<br />
<strong>开 token-level TIS 时精度与 BF16 齐平；不开 TIS 时有明显精度下降。</strong></p>
</blockquote>
<br />
<p><strong>低精度 rollout 的加速红利，是靠 IS 校正才能安全兑现的。</strong></p>
<p>想上 FP8 省成本，就必须同时上 rollout correction —— 两者是配套的。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="22" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h1 id="%E7%86%B5%E5%9D%8D%E5%A1%8C">熵坍塌</h1>
<p>从现象到可操作的干预</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="23" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="%E5%AE%9A%E9%87%8F%E5%88%BB%E7%94%BB">定量刻画</h2>
<p>三个层次的结论：</p>
<ol>
<li>
<p><strong>现象</strong> — 不做干预时，策略熵在训练早期急剧下降，探索能力消失，性能饱和。</p>
</li>
<li>
<p><strong>定量关系</strong> — 拟合出 <code>R = -a·exp(H) + b</code><br />
<strong>熵是性能的上限。</strong> 熵一旦耗尽，性能就锁死了。<br />
实用价值：看着熵曲线就能预判天花板，不必等跑完。</p>
</li>
<li>
<p><strong>机制</strong> — 熵的变化量与「token log-prob 和其 advantage 的协方差」直接相关。<br />
<strong>高协方差 token 是把熵推下去的元凶。</strong></p>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="24" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="%E4%B8%A4%E7%A7%8D%E7%B2%BE%E5%87%86%E5%B9%B2%E9%A2%84">两种精准干预</h2>
<p>定位到元凶后，干预可以很精准（都只作用于高协方差 token）：</p>
<ul>
<li><strong>Clip-Cov</strong> — 对高协方差 token 裁剪更新</li>
<li><strong>KL-Cov</strong> — 对高协方差 token 施加 KL 惩罚</li>
</ul>
<p><strong>效果（7 个数学 benchmark 平均）：</strong></p>
<table>
<thead>
<tr>
<th>模型</th>
<th>GRPO</th>
<th>Clip-Cov</th>
<th>KL-Cov</th>
</tr>
</thead>
<tbody>
<tr>
<td>Qwen2.5-7B</td>
<td>38.6</td>
<td>40.4</td>
<td><strong>40.6</strong></td>
</tr>
<tr>
<td>Qwen2.5-32B</td>
<td>45.8</td>
<td>50.3</td>
<td><strong>52.2</strong></td>
</tr>
</tbody>
</table>
<p><strong>模型越大收益越大</strong>（32B 上 +6.4 分），难题上增益更明显。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="25" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="%E5%AE%9E%E6%93%8D%E5%BB%BA%E8%AE%AE%E4%B8%89%E4%B8%AA%E5%B1%82%E6%AC%A1%E6%88%90%E6%9C%AC%E9%80%92%E5%A2%9E">实操建议：三个层次，成本递增</h2>
<ol>
<li>先调 <code>clip_ratio_high</code> —— 一行配置</li>
<li>不够再上 <strong>KL-Cov</strong> —— verl 有现成脚本</li>
<li>最后才考虑显式熵正则（<code>entropy_coeff</code>）—— 容易训崩，慎用</li>
</ol>
<br />
<p>另有工作给出不同归因：熵动力学主要由<strong>裁剪边界的不对称性</strong>决定，而非协方差。<br />
结论有冲击力：<strong>即使 reward 完全随机，熵也会下降</strong>（clip-high 占主导）。</p>
<p>这与 DAPO 的 Clip-Higher 在方向上完全一致，算是互相印证。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="26" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h1 id="rl-%E5%88%B0%E5%BA%95%E6%9C%89%E6%B2%A1%E6%9C%89%E6%89%A9%E5%B1%95%E6%8E%A8%E7%90%86%E8%BE%B9%E7%95%8C">RL 到底有没有扩展推理边界？</h1>
<p>这场仗决定了我们该给 RL 分配多少算力</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="27" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="%E4%B8%A4%E6%B4%BE">两派</h2>
<p><strong>悲观派</strong>（Yue et al.）<br />
RL 训练后的模型在<strong>高 k 的 pass@k 上反而不如 base model</strong>。<br />
RL 只是把概率质量集中到 base 已有的正确路径上 —— 是&quot;锐化&quot;而非&quot;扩展&quot;。<br />
支撑：只看正确率的 RLVR 会造成多样性坍塌。</p>
<p><strong>乐观派</strong>（ProRL, NVIDIA, NeurIPS）<br />
<strong>之前的悲观结论是因为训得不够久。</strong><br />
长时间 RL 能挖出 base model 即使大量采样也到不了的推理策略。</p>
<p>DeepSeek-V3.2 用真金白银站在乐观派：<strong>RL 预算超过预训练成本的 10%</strong>。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="28" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="%E6%88%91%E7%9A%84%E5%88%A4%E6%96%AD%E4%B8%A4%E6%B4%BE%E5%85%B6%E5%AE%9E%E4%B8%8D%E7%9F%9B%E7%9B%BE">我的判断：两派其实不矛盾</h2>
<p>分歧在于<strong>训练时长和探索保持</strong>：</p>
<ul>
<li>短程 RL + 无熵干预 → 确实是锐化，pass@k 会退化</li>
<li>长程 RL + 熵/多样性维护 → 能扩展边界</li>
</ul>
<p><strong>可操作的三条：</strong></p>
<ol>
<li><strong>必须同时监控 pass@1 和 pass@k</strong> —— 只看 pass@1 会让你误以为在进步，<br />
实际上多样性正在崩。这是最容易踩的坑。</li>
<li><strong>别过早停止 RL</strong> —— ProRL 的教训是很多人在收益出现前就停了。</li>
<li><strong>把多样性写进目标</strong> —— pass@k-aware 的目标能同时改善两者。</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="29" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h1 id="%E5%AF%B9%E6%88%91%E4%BB%AC%E7%9A%84%E5%90%AF%E5%8F%91">对我们的启发</h1>
<p>按投入产出比排序 —— 整份报告我最想传达的部分</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="30" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="%E7%AC%AC%E4%B8%80%E6%A2%AF%E9%98%9F%E5%87%A0%E4%B9%8E%E9%9B%B6%E6%88%90%E6%9C%AC%E7%AB%8B%E5%88%BB%E5%81%9A">第一梯队：几乎零成本，立刻做</h2>
<p><strong>1. Clip-Higher（一行配置）</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">actor_rollout_ref.actor.clip_ratio_low:</span> <span class="hljs-number">0.2</span>
<span class="hljs-attr">actor_rollout_ref.actor.clip_ratio_high:</span> <span class="hljs-number">0.28</span>
</code></pre>
<p><strong>2. 开启 rollout correction 的监控（先只看不改）</strong></p>
<p>先测 <code>rollout_corr/kl</code>、<code>log_ppl_abs_diff</code>、<code>chi2_token</code>，搞清楚我们的 gap 有多大。<br />
<strong>在不知道 gap 大小的情况下调其他超参，等于在噪声上做优化。</strong><br />
开销只有 ~1% 显存、1-3% 算力。</p>
<p><strong>3. 同时监控 pass@1 和 pass@k</strong> — 纯监控成本</p>
<p><strong>4. 熵曲线 + <code>R = -a·exp(H) + b</code></strong> — 拟合一下就能预判天花板</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="31" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="%E7%AC%AC%E4%BA%8C%E6%A2%AF%E9%98%9F%E6%98%8E%E7%A1%AE%E6%94%B6%E7%9B%8A%E9%9C%80%E8%A6%81%E5%B0%91%E9%87%8F%E5%B7%A5%E4%BD%9C">第二梯队：明确收益，需要少量工作</h2>
<p><strong>5. Dynamic Sampling</strong> — 过滤全同 reward 的组，纯浪费算力。<br />
DAPO 用 <code>gen_batch_size=1536 / train_batch_size=512</code> 的超采样比。</p>
<p><strong>6. <code>loss_agg_mode</code> 选 token-mean</strong> — Dr.GRPO 和 DAPO 一致推荐。<br />
verl 默认就是这个，但要确认没被改掉。</p>
<p><strong>7. Overlong Reward Shaping</strong> — 截断样本的负信号是错的<br />
（模型没答错，只是没写完）。设 4096 缓冲区做线性惩罚。</p>
<p><strong>8. KL-Cov</strong>（如果熵坍塌确实是瓶颈）— 32B 上 +6.4 分很实在。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="32" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="%E7%AC%AC%E4%B8%89%E6%A2%AF%E9%98%9F%E5%8F%96%E5%86%B3%E4%BA%8E%E6%88%91%E4%BB%AC%E7%9A%84%E5%85%B7%E4%BD%93%E5%9C%BA%E6%99%AF">第三梯队：取决于我们的具体场景</h2>
<p><strong>9. 如果训 MoE → Router Replay 是必需品，不是可选项</strong><br />
DeepSeek 从 V3-0324 就在用。同时考虑 GSPO 的序列级 IS。</p>
<p><strong>10. 如果想上 FP8 rollout → 必须同时上 TIS</strong><br />
收益：dense 约 12-18% 加速，MoE 超过 35%。</p>
<p><strong>11. 如果任务有中间可验证信号 → 认真考虑 value-based（VAPO 路线）</strong><br />
多步工具调用这类场景，细粒度 credit assignment 的价值远高于纯数学题。<br />
<strong>别因为社区都用 GRPO 就默认放弃 critic。</strong></p>
<p><strong>12. 奖励设计投入 &gt; 算法投入</strong><br />
如果 RM 质量是瓶颈，再换十个 <code>*PO</code> 都没用。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="33" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="%E5%A6%82%E6%9E%9C%E5%8F%AA%E8%AE%B0%E4%B8%89%E4%BB%B6%E4%BA%8B">如果只记三件事</h2>
<ol>
<li>
<p><strong>Clip-Higher</strong> —— 一行配置，抑制熵坍塌，性价比最高</p>
</li>
<li>
<p><strong>先量训练-推理 gap，再调别的</strong> —— 不知道 gap 就调超参 = 在噪声上做优化</p>
</li>
<li>
<p><strong>奖励设计的投入回报高于算法投入</strong> —— 换十个 <code>*PO</code> 抵不上修好 RM</p>
</li>
</ol>
<br />
<p>完整细节见《RL算法调研报告》，含各节的论文链接和待确认事项。</p>
</section>
